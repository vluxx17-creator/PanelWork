<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ryzen Team · Work Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        /* (стили оставлены без изменений, они такие же, как в прошлом ответе) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: radial-gradient(circle at 30% 20%, #1f0a0a, #050505 90%);
        }
        .glass-panel {
            width: 1320px;
            max-width: 100%;
            height: 700px;
            max-height: 95vh;
            background: rgba(16, 16, 16, 0.55);
            backdrop-filter: blur(22px);
            border-radius: 48px;
            border: 1px solid rgba(255, 70, 70, 0.2);
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ... остальные стили из предыдущей версии (они те же) ... */
        /* Для краткости я не копирую их полностью, но в твоём файле они должны быть */
        /* Если нужно, возьми их из предыдущего ответа, они не изменились */
    </style>
</head>
<body>
<div class="glass-panel">
    <div class="top-bar">
        <div class="brand"><i class="fas fa-bolt"></i> Ryzen <span style="color:#fff;">Team</span> <small>· work panel</small></div>
        <div class="user-badge"><i class="fas fa-circle"></i> <span>онлайн</span></div>
    </div>
    <div class="main-content" id="mainContent">
        <div class="page active" id="page-home">
            <div class="cover-area">
                <img class="cover-image" id="coverImage" src="https://i.postimg.cc/mDmd6K96/IMG-2106.jpg" alt="NFT">
                <div class="cover-nft-badge"><i class="fas fa-gem"></i> Vintage Cigar #24057</div>
                <div class="cover-overlay">
                    <button id="changeCoverBtn"><i class="fas fa-pen"></i> Сменить</button>
                    <input type="file" id="coverUpload" accept="image/*">
                </div>
            </div>
            <div class="profile-stats">
                <div class="profile-avatar">R</div>
                <div class="profile-info">
                    <div class="name-wrap">
                        <span class="name" id="displayName">Blackbox_User</span>
                        <i class="fas fa-pencil-alt" id="editNameIcon" style="color:rgba(255,255,255,0.15); cursor:pointer;"></i>
                        <input type="text" class="name-edit" id="nameInput" style="display:none;" maxlength="20">
                    </div>
                    <div class="handle">@blackbox_research</div>
                </div>
                <div class="stats-group">
                    <div class="stat-item"><div class="number empty">—</div><div class="label">Приглашено</div></div>
                    <div class="stat-item"><div class="number">₿ 0.82</div><div class="label">Баланс</div></div>
                    <div class="stat-item"><div class="number">★ 4.9</div><div class="label">Рейтинг</div></div>
                </div>
            </div>
            <div class="widgets-row">
                <div class="widget-item"><i class="fas fa-birthday-cake"></i><div class="w-text"><strong>B-Day</strong><br><span style="font-size:11px; color:rgba(255,255,255,0.2);">14 мая</span></div></div>
                <div class="widget-item"><i class="fas fa-hat-wizard"></i><div class="w-text"><strong>Durov Caps</strong><br><span style="font-size:11px; color:rgba(255,255,255,0.2);">3 шт.</span></div></div>
                <div class="widget-item"><i class="fas fa-rocket"></i><div class="w-text"><strong>Boost</strong><br><span style="font-size:11px; color:rgba(255,255,255,0.2);">активен</span></div></div>
            </div>
        </div>
        <div class="page" id="page-profile">...</div>
        <div class="page" id="page-mentors">...</div>
        <div class="page" id="page-payout">
            <div class="glass-card">
                <div class="card-header">
                    <h3><i class="fas fa-hand-holding-usd"></i> Запрос на выплату</h3>
                    <span style="color:rgba(255,255,255,0.15);"><i class="fas fa-wallet"></i></span>
                </div>
                <div class="payout-form">
                    <div class="form-row">
                        <label>Сделка (NFT-подарок)</label>
                        <select id="payoutNft">
                            <option value="Vintage Cigar #24057">Vintage Cigar #24057</option>
                            <option value="CyberPunk #1337">CyberPunk #1337</option>
                            <option value="Gemstone #009">Gemstone #009</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Кошелёк TON (Tonkeeper)</label>
                        <input type="text" id="payoutWallet" placeholder="EQD... или UQD..." value="EQD1234567890abcdef">
                    </div>
                    <button class="btn-payout btn-pulse" id="payoutBtn"><i class="fas fa-paper-plane" style="margin-right:10px;"></i> ОТПРАВИТЬ ЗАПРОС</button>
                </div>
            </div>
        </div>
        <div class="page" id="page-settings">...</div>
    </div>
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>Главная</span></button>
        <button class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
        <button class="nav-item" data-page="mentors"><i class="fas fa-users"></i><span>Наставники</span></button>
        <button class="nav-item" data-page="payout"><i class="fas fa-dollar-sign"></i><span>Выплаты</span></button>
        <button class="nav-item" data-page="settings"><i class="fas fa-cog"></i><span>Настройки</span></button>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
    // (скрипт из предыдущей версии, он работает)
    (function() {
        // ... тот же код, что был
    })();
</script>
</body>
</html>
